<main>
  <div class="img-container"><img class="imgLog" src="img/ranger.png" alt=""></div>
  <div class="login-container">
    <img class="logoImg" src="img/ford.png" alt="">
    <h3 class="saudacao">Boas-Vindas</h3>
    <form #loginFrom="ngForm" (ngSubmit)="login()">
      <input type="text" name="nome" placeholder="E-mail"[(ngModel)]="usuario.nome" required>
      <input type="password" name="senha" placeholder="Senha" [(ngModel)]="usuario.senha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</main>
